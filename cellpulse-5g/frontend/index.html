<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CellPulse 5G - Interactive Coverage Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
    header {
      height: 60px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 2px solid #00f2fe;
      z-index: 1000;
      position: relative;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #00f2fe;
    }
    .badge {
      background: #7c3aed;
      color: #fff;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    #map {
      width: 100%;
      height: calc(100vh - 60px);
    }
    /* Panel lateral flotante */
    .pricing-card {
      position: absolute;
      top: 80px;
      right: 20px;
      width: 280px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1000;
    }
    .pricing-card h4 {
      color: #00f2fe;
      margin-bottom: 8px;
    }
    .pricing-card p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .btn-pro {
      width: 100%;
      background: #00f2fe;
      color: #0f172a;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-pro:hover {
      background: #38ef7d;
    }
    /* Modal de Suscripción */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1e293b;
      color: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-content h3 {
      color: #00f2fe;
      margin-bottom: 8px;
    }
    .modal-content p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-cancel {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #475569;
      color: #fff;
      cursor: pointer;
    }
    .btn-submit {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #00f2fe;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CellPulse 5G</div>
    <div class="badge">B2B SaaS Platform</div>
  </header>

  <!-- Tarjeta lateral -->
  <div class="pricing-card">
    <h4>Suscripción Empresarial</h4>
    <p>Acceso a la API de mapas de cobertura y reporte de puntos ciegos en tiempo real.</p>
    <button onclick="subscribeAPI()" class="btn-pro">Adquirir API Pro</button>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Modal Formulario 7 Días -->
  <div id="subscriptionModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Prueba Gratuita API Pro (7 Días)</h3>
      <p>Ingresa tus datos básicos para desbloquear la densidad completa de torres 5G en Bogotá:</p>
      <form id="trialForm" onsubmit="handleTrialSubmit(event)">
        <div class="form-group">
          <label>Nombre completo:</label>
          <input type="text" required placeholder="Ej. Ana Gómez">
        </div>
        <div class="form-group">
          <label>Correo electrónico:</label>
          <input type="email" required placeholder="ana@empresa.com">
        </div>
        <div class="form-actions">
          <button type="button" onclick="closeModal()" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit">Activar 7 Días</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Inicialización del Mapa centrado en Bogotá
    var map = L.map('map').setView([4.635, -74.082], 12);

    // Servidor GIS libre de Esri (sin API key requerida)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; CellPulse 5G Coverage Map'
    }).addTo(map);

    // 2. Antenas iniciales (Modo Gratuito Básico)
    var baseMarkers = [
      L.marker([4.6097, -74.0817]).bindPopup('<b>Torre CP-01 (Centro)</b><br>Estado: Operativa 5G'),
      L.marker([4.6280, -74.0650]).bindPopup('<b>Torre CP-02 (Chapinero)</b><br>Estado: Operativa 4G/5G'),
      L.marker([4.5980, -74.0760]).bindPopup('<b>Torre CP-03 (La Candelaria)</b><br>Estado: Mantenimiento')
    ];

    baseMarkers.forEach(function(m) { m.addTo(map); });

    // 3. Antenas Premium en Bogotá (Se desbloquean tras llenar el formulario)
    var premiumMarkers = [
      L.marker([4.6580, -74.0930]).bindPopup('<b>Torre CP-04 (Engativá)</b><br>Estado: Operativa 5G <b style="color:#00f2fe;">[PRO]</b>'),
      L.marker([4.6970, -74.0320]).bindPopup('<b>Torre CP-05 (Usaquén)</b><br>Estado: Operativa 5G <b style="color:#00f2fe;">[PRO]</b>'),
      L.marker([4.6350, -74.1350]).bindPopup('<b>Torre CP-06 (Kennedy)</b><br>Estado: Alerta Cobertura <b style="color:#00f2fe;">[PRO]</b>'),
      L.marker([4.5800, -74.1500]).bindPopup('<b>Torre CP-07 (Ciudad Bolívar)</b><br>Estado: Punto Ciego <b style="color:#00f2fe;">[PRO]</b>'),
      L.marker([4.6750, -74.0480]).bindPopup('<b>Torre CP-08 (Suba)</b><br>Estado: Operativa 5G <b style="color:#00f2fe;">[PRO]</b>'),
      L.marker([4.6480, -74.1080]).bindPopup('<b>Torre CP-09 (Fontibón)</b><br>Estado: Operativa 5G <b style="color:#00f2fe;">[PRO]</b>')
    ];

    // 4. Lógica de Interacción
    function subscribeAPI() {
      document.getElementById('subscriptionModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('subscriptionModal').style.display = 'none';
    }

    function handleTrialSubmit(event) {
      event.preventDefault();
      closeModal();

      // Renderizar antenas adicionales en el mapa
      premiumMarkers.forEach(function(m) { m.addTo(map); });

      // Ajustar encuadre de la vista
      map.flyTo([4.640, -74.080], 12);

      // Notificación de confirmación
      alert("¡Suscripción de prueba (7 días) activada exitosamente!\n\nSe ha enviado un correo de confirmación con la API Key Pro de prueba a tu cuenta.\n\nSe han desbloqueado 6 nuevas torres de cobertura 5G en Bogotá.");
    }
  </script>
</body>
</html>
