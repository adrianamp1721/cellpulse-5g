name: CellPulse 5G Enterprise CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality-and-tests:
    name: Backend Unit Tests & RF Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cellpulse-5g/backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: PYTHONPATH=. pytest -v

  docker-build-validation:
    name: Build Cloud-Native Container
    runs-on: ubuntu-latest
    needs: backend-quality-and-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t cellpulse-5g-api:${{ github.sha }} ./cellpulse-5g/backend

  deploy-azure-static-web-app:
    name: Deploy Frontend to Azure
    runs-on: ubuntu-latest
    needs: docker-build-validation
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/cellpulse-5g/frontend"
          output_location: ""
