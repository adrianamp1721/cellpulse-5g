name: CellPulse 5G Enterprise CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  backend-quality-and-tests:
    name: Backend Unit Tests & RF Validation
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Run Pytest
        working-directory: ./cellpulse-5g/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          touch app/__init__.py
          PYTHONPATH=. pytest -v

  docker-build-validation:
    name: Build Cloud-Native Container
    needs: backend-quality-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t cellpulse-5g-api:${{ github.sha }} ./cellpulse-5g/backend

  build_and_deploy_job:
    name: Deploy Frontend to Azure
    needs: docker-build-validation
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_FIELD_073A24510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/cellpulse-5g/frontend"
          api_location: ""
          output_location: ""
          skip_app_build: true
